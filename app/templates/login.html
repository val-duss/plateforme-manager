<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Plateforme Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container" style="max-width:360px; padding-top:80px;">
    <div class="card">
      <h1 style="text-align:center;">Plateforme Manager</h1>
      <p class="subtitle" style="text-align:center;">Entrez le code PIN pour accéder à l'application.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post">
        <input type="hidden" name="next" value="{{ next_path }}">
        <div class="field">
          <label for="pin">Code PIN</label>
          <input type="password" id="pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
                 autocomplete="off" autofocus required
                 style="text-align:center; font-size:1.5rem; letter-spacing:0.5em;">
        </div>
        <div class="actions" style="justify-content:center; margin-top:14px;">
          <button type="submit" class="btn btn-primary">Valider</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
