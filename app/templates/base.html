<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Plateforme Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('main.index') }}">Plateforme Manager</a>
      <nav>
        <a href="{{ url_for('main.index') }}">Plateformes</a>
        <a href="{{ url_for('main.journal') }}">Journal</a>
        <a href="{{ url_for('main.tools') }}">Outils</a>
        <a class="btn btn-primary btn-sm" href="{{ url_for('main.platform_new') }}">+ Nouvelle plateforme</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
